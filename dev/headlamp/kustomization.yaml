apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/headlamp
patches:
  # external-dns publishes flux.mapko.dev from this hostname; TLS comes from
  # the Gateway's *.mapko.dev wildcard certificate.
  - target:
      kind: HTTPRoute
      name: headlamp
    patch: |
      - op: add
        path: /spec/hostnames
        value:
          - flux.mapko.dev
