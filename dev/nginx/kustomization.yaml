apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/nginx
patches:
  # external-dns publishes dev.mapko.dev from this hostname.
  - target:
      kind: HTTPRoute
      name: nginx
    patch: |
      - op: add
        path: /spec/hostnames
        value:
          - dev.mapko.dev
  # Handover to Argo CD (mmirceta/argocd): keep Flux from deleting the
  # nginx objects once they leave this repo. Top-level metadata only, so the
  # pod template is unchanged and nothing rolls out.
  - target:
      name: ".*"
    patch: |
      apiVersion: v1
      kind: not-important
      metadata:
        name: not-important
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
