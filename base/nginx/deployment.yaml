apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  # No replicas: the HPA owns the replica count (hpa.yaml).
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: applications
      serviceAccountName: nginx-vault
      initContainers:
        - name: verify-vault-secrets
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - test -s /mnt/secrets-store/username; test -s /mnt/secrets-store/password; test "$(cat /mnt/secrets-store/username)" != "null"; test "$(cat /mnt/secrets-store/password)" != "null"; echo "Vault secrets successfully validated"
          volumeMounts:
            - name: vault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      containers:
        - name: nginx
          image: acrbootstraptraining.azurecr.io/nginx:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: vault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/server-tokens.conf
              subPath: server-tokens.conf
              readOnly: true
      volumes:
        - name: vault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: nginx-vault-secrets
        - name: nginx-config
          configMap:
            name: nginx-config
