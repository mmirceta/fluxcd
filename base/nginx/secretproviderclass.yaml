# Requires the Secrets Store CSI driver and the Vault CSI provider
# (installed by Terraform, devops-training-project modules/k8s/vault).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nginx-vault-secrets
spec:
  provider: vault
  parameters:
    vaultAddress: http://vault.vault.svc.cluster.local:8200
    roleName: nginx-role
    audience: vault
    objects: |
      - objectName: "username"
        secretPath: "secret/data/nginx"
        secretKey: "username"

      - objectName: "password"
        secretPath: "secret/data/nginx"
        secretKey: "password"
