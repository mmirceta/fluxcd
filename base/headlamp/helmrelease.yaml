# Headlamp: Kubernetes web UI, with the Flux plugin. Installed by Flux's
# helm-controller (enabled in devops-training-project modules/k8s/flux).
# No Ingress/HTTPRoute: reach it with kubectl port-forward through Bastion.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    # Users log in with their own token (see user.yaml), so the pod's own
    # ServiceAccount needs no cluster-admin binding.
    clusterRoleBinding:
      create: false

    config:
      pluginsDir: /build/plugins

    # The Flux plugin ships as an image; the init container copies it into
    # a shared emptyDir. Lighter than the chart's pluginsManager sidecar,
    # which runs npm install at startup.
    initContainers:
      - name: headlamp-plugins
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /build/plugins
    volumes:
      - name: headlamp-plugins
        emptyDir: {}

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
