# Login identity for Headlamp. edit in every namespace (create/update/delete
# workloads, including Secrets; no RBAC or namespace changes), metrics.k8s.io
# for CPU/memory usage, and edit on Flux objects so the Flux plugin can
# trigger reconcile / suspend / resume. Objects that come from this repo are
# reverted by Flux on its next sync. Get a short-lived token with:
#   kubectl -n headlamp create token headlamp-user
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-user
---
# New name rather than changing headlamp-user-view: a binding's roleRef is
# immutable, so Flux couldn't update it in place. Prune removes the old one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: headlamp-user
    namespace: headlamp
---
# flux-edit is created by the flux2 chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-flux-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-edit
subjects:
  - kind: ServiceAccount
    name: headlamp-user
    namespace: headlamp
---
# view/edit don't cover metrics.k8s.io on AKS; Headlamp needs it for node and
# pod CPU/memory usage.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-metrics-reader
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-metrics-reader
subjects:
  - kind: ServiceAccount
    name: headlamp-user
    namespace: headlamp
---
# The Flux plugin's Overview lists CRDs to detect Flux and shows "Flux is not
# installed" without this; edit doesn't cover cluster-scoped CRDs. Read-only,
# CRDs hold only schemas.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-crd-reader
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-crd-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-crd-reader
subjects:
  - kind: ServiceAccount
    name: headlamp-user
    namespace: headlamp
