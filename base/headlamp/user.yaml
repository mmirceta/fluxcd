# Login identity for Headlamp. Read-only on the whole cluster (view, which
# excludes Secrets, plus metrics.k8s.io for CPU/memory usage) plus edit on
# Flux objects, so the Flux plugin can trigger reconcile / suspend / resume.
# Get a short-lived token with:
#   kubectl -n headlamp create token headlamp-user
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-user
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-user
    namespace: headlamp
---
# flux-edit is created by the flux2 chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-flux-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-edit
subjects:
  - kind: ServiceAccount
    name: headlamp-user
    namespace: headlamp
---
# view doesn't cover metrics.k8s.io on AKS; Headlamp needs it for node and
# pod CPU/memory usage.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-metrics-reader
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-metrics-reader
subjects:
  - kind: ServiceAccount
    name: headlamp-user
    namespace: headlamp
