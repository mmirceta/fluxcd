# Attached to the shared Gateway (NGINX Gateway Fabric), HTTPS listener
# only: the login token must never travel over plain HTTP. Hostnames are
# environment-specific and added by the overlay (<env>/headlamp).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: https
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
