# Attached to the shared Gateway (NGINX Gateway Fabric). Hostnames are
# environment-specific and added by the overlay (<env>/apache).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apache
spec:
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /apache
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: apache
          port: 80
